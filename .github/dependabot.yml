version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [ "dependencies" ]
    commit-message:
      prefix: "deps"
    groups:
      # Hibernate artifacts must move together or the build breaks.
      hibernate:
        patterns: [ "org.hibernate*:*" ]
      maven-plugins:
        patterns: [ "org.apache.maven.plugins:*" ]
      test:
        patterns: [ "org.mockito:*", "org.junit*:*", "org.hamcrest:*" ]
    ignore:
      # Bumping paper-api raises the minimum supported server version, so it stays manual.
      - dependency-name: "io.papermc.paper:paper-api"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels: [ "dependencies", "github-actions" ]
    commit-message:
      prefix: "ci"
