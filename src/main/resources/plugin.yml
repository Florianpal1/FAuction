name: FAuction
main: fr.florianpal.fauction.FAuction
author: florianpal
version: 2.0.0
api-version: 1.13
softdepend: [Vault]
permissions:
  fauction.user:
    default: op
    children:
      fauction.list: true
      fauction.sell: true
      fauction.expire: true
  fauction.bypass.spam: # Ignore the anti packet spamming protection
    default: op